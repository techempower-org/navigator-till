[project]
name = "navigator-till"
version = "0.2.0"
description = "A plain-language front-desk agent for a small nonprofit: sliding-scale device invoices and donations on PayPal (sandbox) with an AI explainer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navigator_till*"]

[tool.setuptools.package-data]
navigator_till = ["pricing.yaml", "templates/*.html"]
